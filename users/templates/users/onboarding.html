<!DOCTYPE html>
<html>
<head>
    <title>Set Your Goal - Focus Platform</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'users/css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
    </style>
</head>
<body>
    <!-- Netflix-style Nav -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">🎯 focus</a>
        <ul class="navbar-nav">
            <li><a href="/users/dashboard/" class="nav-link">🏠 Home</a></li>
            <li><a href="/focus/timer/" class="nav-link">⏱️ Timer</a></li>
            <li><a href="/users/onboarding/" class="nav-link active">⚙️ Settings</a></li>
        </ul>
    </nav>

    <!-- Duolingo-style Form -->
    <div class="form-container fade-in-up">
        <div class="form-card">
            <h1>🎯 Set Your Goal</h1>
            <p class="subtitle">Tell us what you want to learn, and we'll personalize your entire experience.</p>

            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label class="form-label" for="goal">What do you want to learn?</label>
                    <input 
                        type="text" 
                        id="goal"
                        name="goal" 
                        class="form-input" 
                        placeholder="e.g. Master Machine Learning, Learn Python"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="daily_target_minutes">Minutes per day</label>
                    <input 
                        type="number" 
                        id="daily_target_minutes"
                        name="daily_target_minutes" 
                        class="form-input" 
                        placeholder="e.g. 25"
                        min="5" 
                        max="480"
                        required
                    >
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.5rem;">
                        💡 We recommend starting with 25 minutes (1 Pomodoro)
                    </p>
                </div>

                <button type="submit" class="btn btn-duolingo btn-block btn-lg" style="margin-top: 0.5rem;">
                    🚀 Start My Journey
                </button>
            </form>
        </div>
    </div>
</body>
</html>
