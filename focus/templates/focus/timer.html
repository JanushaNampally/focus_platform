{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Focus Timer - Focus Platform</title>
    <link rel="stylesheet" href="{% static 'users/css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background: #141414; }
    </style>
</head>
<body>
    <!-- Nav -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">🎯 focus</a>
        <ul class="navbar-nav">
            <li><a href="/users/dashboard/" class="nav-link">🏠 Home</a></li>
            <li><a href="/focus/timer/" class="nav-link active">⏱️ Timer</a></li>
            <li><a href="/users/onboarding/" class="nav-link">⚙️ Settings</a></li>
        </ul>
    </nav>

    <!-- Timer Section -->
    <div class="timer-section">
        <div class="timer-card fade-in-up">
            <h1>🧘 Focus Session</h1>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">25-minute Pomodoro — stay in the zone 🎯</p>

            <!-- Progress Ring (Duolingo-style) -->
            <div class="progress-ring-container">
                <div class="progress-ring">
                    <svg viewBox="0 0 160 160">
                        <circle class="bg" cx="80" cy="80" r="70"/>
                        <circle class="progress" id="progressCircle" cx="80" cy="80" r="70"/>
                    </svg>
                    <div class="center-text">
                        <div class="value" id="timer">25:00</div>
                        <div class="label" id="statusLabel">READY</div>
                    </div>
                </div>
            </div>

            <!-- Meta info -->
            <div class="timer-meta">
                <div class="timer-meta-item">
                    <div class="label">Session</div>
                    <div class="value">Pomodoro</div>
                </div>
                <div class="timer-meta-item">
                    <div class="label">Duration</div>
                    <div class="value">25 min</div>
                </div>
                <div class="timer-meta-item">
                    <div class="label">Status</div>
                    <div class="value" id="statusValue">⏸ Waiting</div>
                </div>
            </div>

            <!-- Actions -->
            <div class="timer-actions">
                <button onclick="startTimer()" class="btn btn-duolingo btn-lg" id="startBtn">
                    ▶ Start
                </button>
                <button onclick="resetTimer()" class="btn btn-secondary btn-lg">
                    ↺ Reset
                </button>
            </div>

            <a id="completeLink" href="/focus/complete/" class="btn btn-duolingo btn-block btn-lg" 
               style="display:none; margin-top: 1.5rem;">
                Complete & Save
            </a>

            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 2rem;">
                💡 Stay focused. Every session builds your streak. You've got this!
            </p>
        </div>
    </div>

    <script>
        const TOTAL_SECONDS = 25 * 60;
        let totalSeconds = TOTAL_SECONDS;
        let timerRunning = false;
        let interval;

        const CIRCUMFERENCE = 440; // 2 * π * 70

        function updateDisplay() {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            document.getElementById("timer").innerText = 
                minutes + ":" + (seconds < 10 ? "0" : "") + seconds;

            // Update progress ring
            const offset = CIRCUMFERENCE * (1 - totalSeconds / TOTAL_SECONDS);
            document.getElementById("progressCircle").style.strokeDashoffset = offset;
        }

        function updateStatus(status, label) {
            document.getElementById("statusValue").innerText = status;
            document.getElementById("statusLabel").innerText = label;
        }

        function startTimer() {
            if (timerRunning) return;
            timerRunning = true;
            const btn = document.getElementById("startBtn");
            btn.innerText = "⏸ Focusing...";
            btn.style.opacity = "0.8";
            document.getElementById("progressCircle").style.stroke = "#58cc02";
            updateStatus("Focusing", "FOCUS");

            interval = setInterval(() => {
                if (totalSeconds > 0) {
                    totalSeconds--;
                    updateDisplay();
                } else {
                    clearInterval(interval);
                    timerRunning = false;
                    btn.innerText = "▶ Start";
                    btn.style.opacity = "1";
                    document.getElementById("progressCircle").style.stroke = "#ff4b4b";
                    updateStatus("✅ Complete!", "DONE");
                    document.getElementById("completeLink").style.display = "flex";
                    document.getElementById("timer").style.color = "#ff9600";
                    alert("🎉 Amazing! Session complete. Keep the momentum!");
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(interval);
            totalSeconds = TOTAL_SECONDS;
            timerRunning = false;
            document.getElementById("startBtn").innerText = "▶ Start";
            document.getElementById("startBtn").style.opacity = "1";
            document.getElementById("timer").style.color = "#58cc02";
            document.getElementById("progressCircle").style.stroke = "#58cc02";
            updateStatus("⏸ Waiting", "READY");
            document.getElementById("completeLink").style.display = "none";
            updateDisplay();
        }

        // Init progress ring
        document.getElementById("progressCircle").style.strokeDasharray = CIRCUMFERENCE;
        document.getElementById("progressCircle").style.strokeDashoffset = CIRCUMFERENCE;
        document.getElementById("progressCircle").style.stroke = "#58cc02";

        updateDisplay();
    </script>
</body>
</html>
